[project]
name = "forge-lm"
version = "0.0.1"
description = "ForgeLM - Train, Fine-Tune & Serve a Small Language Model (edge/on-device assistant)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.0.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "hydra-core>=1.3.2",
    "numpy>=2.0.0",
    "onnx>=1.22.0",
    "onnxruntime>=1.29.0",
    "onnxscript>=0.7.1",
    "prometheus-client>=0.26.0",
    "pydantic>=2.7.0",
    "regex>=2026.7.19",
    "slowapi>=0.1.10",
    "streamlit>=1.62.0",
    "tensorboard>=2.16.0",
    "torch>=2.4.0",
    "tqdm>=4.66.0",
    "uvicorn>=0.52.4",
]

[project.scripts]
forger-data-validate = "forger.data.contract:main"

[dependency-groups]
dev = [
    "hypothesis>=6.100.0",
    "kaggle>=2.2.4",
    "pytest>=8.0.0",
    "pytest-benchmark>=4.0.0",
    "ruff>=0.6.0",
    "tokenizers>=0.23.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["forger"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["*.ipynb"]

[tool.ruff.lint.isort]
known-first-party = ["forger"]
